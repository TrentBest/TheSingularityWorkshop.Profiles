<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Profiles: the observer-specific representation pipeline</title>
  <desc id="desc">A source-informed diagram of Profile.RepresentTo. Claims enter through per-key disclosure rules. Public, explicitly allowed, and group-member observers receive permitted claims; an excluded observer receives a representation with null display name, anonymous avatar, and no claims. The original Profile remains outside the representation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#334155"/></marker>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px}.heading{font-size:26px;font-weight:750}.body{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.node{stroke-width:2.5}.arrow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="940" fill="#f8fafc"/><rect width="1400" height="12" fill="#0f766e"/>
  <text x="60" y="62" class="eyebrow" fill="#0f766e">THE SINGULARITY WORKSHOP · PROFILES</text>
  <text x="60" y="105" font-size="37" font-weight="800">One Profile. Different permitted representations.</text>
  <text x="60" y="139" class="body">A map of the current Profile.RepresentTo implementation—not a claim of whole-system authorization.</text>
  <rect x="60" y="185" width="350" height="190" rx="18" fill="#e0f2fe" stroke="#0369a1" class="node"/>
  <text x="88" y="225" class="eyebrow" fill="#075985">01 · OWNED DOMAIN STATE</text><text x="88" y="263" class="heading">Profile</text>
  <text x="88" y="299" class="body">Stable ProfileId · entity kind</text><text x="88" y="328" class="body">DisplayName · claims · groups</text><text x="88" y="357" class="body">relationships · exclusions · avatars</text>
  <rect x="515" y="185" width="370" height="190" rx="18" fill="#fef3c7" stroke="#b45309" class="node"/>
  <text x="543" y="225" class="eyebrow" fill="#92400e">02 · DISCLOSURE DECISION</text><text x="543" y="263" class="heading">Per-key rules</text>
  <text x="543" y="299" class="body">Private · Public · Explicit · Group</text><text x="543" y="328" class="body">No matching rule → claim omitted</text><text x="543" y="357" class="body">Optional override replaces claim value</text>
  <path d="M410 280 H515" class="arrow"/>
  <rect x="990" y="185" width="350" height="190" rx="18" fill="#dcfce7" stroke="#15803d" class="node"/>
  <text x="1018" y="225" class="eyebrow" fill="#166534">03 · REPRESENTATION</text><text x="1018" y="263" class="heading">ProfileRepresentation</text>
  <text x="1018" y="299" class="body">ProfileId · display name · avatar</text><text x="1018" y="328" class="body">Copied, read-only claims dictionary</text><text x="1018" y="357" class="body">Claim values are not deep-cloned</text>
  <path d="M885 280 H990" class="arrow"/>
  <path d="M1165 375 V420 H240 V460" class="arrow"/><path d="M1165 420 H700 V460" class="arrow"/><path d="M1165 420 H1160 V460" class="arrow"/>
  <text x="60" y="447" class="eyebrow">SAME SOURCE PROFILE · DIFFERENT REQUEST CONTEXT</text>
  <rect x="60" y="470" width="360" height="220" rx="18" fill="#fff" stroke="#15803d" class="node"/>
  <text x="88" y="510" class="heading">Public observer</text><text x="88" y="548" class="body">Receives only claims whose</text><text x="88" y="576" class="body">rules allow Public access.</text><text x="88" y="620" class="small">A public rule on one key does</text><text x="88" y="643" class="small">not publish unrelated claims.</text>
  <rect x="520" y="470" width="360" height="220" rx="18" fill="#fff" stroke="#b45309" class="node"/>
  <text x="548" y="510" class="heading">Explicit / group observer</text><text x="548" y="548" class="body">Explicit: observer ID matches.</text><text x="548" y="576" class="body">Group: allowed group IDs overlap</text><text x="548" y="604" class="body">the effective membership set.</text><text x="548" y="650" class="small">Host-supplied memberships must</text><text x="548" y="673" class="small">be trustworthy.</text>
  <rect x="980" y="470" width="360" height="220" rx="18" fill="#f1f5f9" stroke="#64748b" class="node"/>
  <text x="1008" y="510" class="heading">Excluded observer</text><text x="1008" y="548" class="body">Early return:</text><text x="1008" y="578" class="body">display name = null</text><text x="1008" y="608" class="body">avatar = "anonymous"</text><text x="1008" y="638" class="body">claims = empty</text><text x="1008" y="673" class="small">Stable ProfileId remains present.</text>
  <rect x="60" y="735" width="1280" height="94" rx="15" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="88" y="772" class="eyebrow" fill="#991b1b">SECURITY BOUNDARY</text><text x="88" y="804" class="body">The projection does not protect the original Profile object, enforce endpoint access, authenticate observers, or deep-clone mutable claim values.</text>
  <line x1="60" y1="855" x2="1340" y2="855" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="885" class="tiny">PROVENANCE: source-informed diagram based on Profile.cs, Disclosure.cs, and ProfileRepresentation.cs.</text>
  <text x="60" y="910" class="tiny">Workshop runtime used: API semantics inspected; SVG is hand-authored, not generated by running the package. GUI.SVG: NOT USED.</text>
</svg>